<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Thư viện quiz kiến thức phim, mở đầu với Đầu Xuân Tươi Sáng.">
<title>Đố Vui Màn Ảnh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Oswald:wght@500;700&family=Roboto+Slab:wght@500;700&family=Playfair+Display:ital,wght@0,700;1,500;1,700&family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: một cột như tập kịch bản. Mỗi phim mang bảng màu riêng (data-film), trang thư viện là phòng chiếu tối */
:root, [data-film="home"] {
  --bg: #15121b; --bg-art: radial-gradient(1200px 500px at 50% -10%, #3a2a4a66, transparent 70%);
  --card: #1f1a27; --opt: #262030; --ink: #f4eff8; --muted: #a79fb4; --line: #342c40;
  --accent: #ffb547; --accent-ink: #1a1305; --accent2: #ff6b6b;
  --ok: #5fd0a0; --ok-soft: #173a2e; --no: #ff7a6b; --no-soft: #3d1d1c;
  --display: "Fraunces", Georgia, serif;
  color-scheme: dark;
}
[data-film="dau-xuan-tuoi-sang"] {
  --bg: #fdf4f3;
  --bg-art: radial-gradient(700px 420px at 100% 0%, #f9cdd6aa, transparent 70%), radial-gradient(640px 420px at 0% 100%, #d5eddcaa, transparent 70%);
  --card: #ffffff; --opt: #fff7f8; --ink: #3a2130; --muted: #8c6a79; --line: #f0d6dc;
  --accent: #e0577a; --accent-ink: #ffffff; --accent2: #5fa774;
  --ok: #3c9466; --ok-soft: #e1f2e6; --no: #cf4b3c; --no-soft: #fbe3de;
  --display: "Fraunces", Georgia, serif;
  color-scheme: light;
}
[data-film="squid-game-1"] {
  --bg: #0b0a0f;
  --bg-art: radial-gradient(800px 380px at 50% -5%, #ff2e8840, transparent 70%), radial-gradient(600px 400px at 100% 100%, #1fa79a26, transparent 70%);
  --card: #15131b; --opt: #1d1a25; --ink: #f5f2f7; --muted: #9c94a8; --line: #2b2634;
  --accent: #ff2e88; --accent-ink: #ffffff; --accent2: #1fb5a5;
  --ok: #1fb5a5; --ok-soft: #0f2f2c; --no: #ff4d5e; --no-soft: #3a1219;
  --display: "Oswald", "Arial Narrow", sans-serif;
  color-scheme: dark;
}
[data-film="crazy-rich-asians"] {
  --bg: #0c2b22;
  --bg-art: radial-gradient(800px 420px at 50% -10%, #d9b45a33, transparent 70%), repeating-linear-gradient(45deg, #ffffff05 0 2px, transparent 2px 14px);
  --card: #11382c; --opt: #0e3127; --ink: #f7f0dd; --muted: #b8c3ae; --line: #295a49;
  --accent: #dcb75c; --accent-ink: #0c2b22; --accent2: #c8473a;
  --ok: #8ad8ab; --ok-soft: #1a4c3b; --no: #f3907f; --no-soft: #4a2521;
  --display: "Playfair Display", Georgia, serif;
  color-scheme: dark;
}
[data-film="madoff"] {
  --bg: #0b1220;
  --bg-art: radial-gradient(900px 420px at 80% -10%, #d6334033, transparent 70%), repeating-linear-gradient(0deg, #ffffff06 0 1px, transparent 1px 28px);
  --card: #111b2d; --opt: #0e1726; --ink: #eef2f8; --muted: #94a3b8; --line: #23324a;
  --accent: #e5484d; --accent-ink: #ffffff; --accent2: #3fa7f5;
  --ok: #4cc38a; --ok-soft: #12302a; --no: #ff7b72; --no-soft: #3a1a1d;
  --display: "Roboto Slab", Georgia, serif;
  color-scheme: dark;
}
[data-film="madoff"] .poster { font-size: 40px; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.mode.terms { border-left: 4px solid var(--ok); }
.mode.terms:hover { border-color: var(--ok); }
.mode.all { border-left: 4px solid var(--ink); background: color-mix(in srgb, var(--accent) 10%, var(--opt)); }
.mode.all:hover { border-color: var(--ink); }
.tag.all { background: var(--ink); color: var(--card); }
.cat { color: var(--muted); }
.mode.eps { border-left: 4px solid var(--no); }
.mode.eps:hover { border-color: var(--no); }
.tag.eps { background: var(--no); color: var(--card); }
.tag.terms { background: var(--ok); color: var(--card); }
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0; min-height: 100vh;
  background: var(--bg-art), var(--bg); background-attachment: fixed;
  color: var(--ink); font-family: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px 64px;
  transition: background-color .4s, color .4s;
}
[hidden] { display: none !important; }
.wrap { max-width: 720px; margin: 0 auto; display: grid; gap: 32px; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; line-height: 1.15; text-wrap: balance; margin: 0; }
.label { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Masthead */
.mast { display: grid; gap: 8px; }
.mast h1 { font-size: clamp(36px, 8vw, 56px); font-family: "Fraunces", Georgia, serif; }
.mast h1 em { font-style: italic; font-weight: 500; color: var(--accent); }
.mast p { margin: 0; color: var(--muted); max-width: 56ch; }
body:not([data-film="home"]) .mast { display: none; }

/* Library: mỗi thẻ là một tấm poster nhỏ mang màu của phim */
.shelf { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.film {
  position: relative; overflow: hidden; text-align: left; color: var(--ink);
  background: var(--bg-art), var(--card); border: 1px solid var(--line); border-radius: 16px;
  padding: 0; display: grid; grid-template-rows: auto 1fr; transition: transform .2s, box-shadow .2s;
}
.film:hover { transform: translateY(-3px); box-shadow: 0 14px 40px -18px var(--accent); }
.film .poster {
  height: 112px; display: grid; place-items: center; border-bottom: 1px solid var(--line);
  font-family: var(--display); font-size: 40px; letter-spacing: .06em; color: var(--accent);
  background: radial-gradient(circle at 30% 20%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 60%), var(--opt);
}
[data-film="squid-game-1"] .poster { font-size: 46px; letter-spacing: .3em; }
.film .body { padding: 18px 20px 20px; display: grid; gap: 8px; align-content: start; }
.film h3 { font-size: 23px; }
.film .meta { font-size: 14px; color: var(--muted); }
.film .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.pill { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px; padding: 3px 10px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.film.soon { cursor: default; border-style: dashed; background: transparent; }
.film.soon:hover { transform: none; box-shadow: none; }
.film.soon .poster { color: var(--muted); background: transparent; font-size: 32px; }
.film.soon h3 { color: var(--muted); font-weight: 500; font-style: italic; }

/* Game */
.game { display: grid; gap: 20px; }
.hero { display: grid; gap: 6px; }
.hero .motif { font-family: var(--display); color: var(--accent); font-size: 15px; letter-spacing: .2em; }
.hero h1 { font-size: clamp(32px, 7vw, 48px); }
[data-film="squid-game-1"] .hero h1 { text-transform: uppercase; letter-spacing: .02em; }
[data-film="crazy-rich-asians"] .hero h1 { font-style: italic; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.back { background: none; border: 0; padding: 0; color: var(--muted); font-size: 14px; }
.back:hover { color: var(--accent); }
.track { display: grid; grid-auto-flow: column; gap: 3px; }
.track span { height: 6px; border-radius: 3px; background: var(--line); }
.track span.ok { background: var(--ok); }
.track span.no { background: var(--no); }
.track span.now { background: var(--accent); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: clamp(20px, 5vw, 36px); display: grid; gap: 20px; box-shadow: 0 20px 50px -30px color-mix(in srgb, var(--accent) 60%, transparent); }
[data-film="crazy-rich-asians"] .card { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.qhead { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.num { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 13px; color: var(--accent); font-variant-numeric: tabular-nums; }
.score { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.q { font-size: clamp(22px, 4.5vw, 28px); }
[data-film="squid-game-1"] .q { font-weight: 500; }
.opts { display: grid; gap: 10px; }
.opt {
  display: grid; grid-template-columns: 32px 1fr; gap: 12px; align-items: center; text-align: left;
  background: var(--opt); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; color: var(--ink);
  transition: border-color .12s, background .12s, transform .12s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); transform: translateX(2px); }
.opt .key { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 13px; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; border: 1px solid var(--line); color: var(--muted); }
[data-film="squid-game-1"] .opt .key { border-radius: 50%; }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .key { background: var(--ok); border-color: var(--ok); color: var(--card); }
.opt.wrong { border-color: var(--no); background: var(--no-soft); }
.opt.wrong .key { background: var(--no); border-color: var(--no); color: var(--card); }
.explain { border-top: 1px solid var(--line); padding-top: 16px; display: grid; gap: 4px; }
.explain strong { font-family: var(--display); font-size: 19px; }
.explain.ok strong { color: var(--ok); }
.explain.no strong { color: var(--no); }
.explain p { margin: 0; color: var(--muted); }
.actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 99px; padding: 11px 22px; background: var(--accent); color: var(--accent-ink); font-weight: 600; transition: filter .15s; }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.ghost:hover { border-color: var(--accent); }

/* Result */
.big { font-family: var(--display); font-size: clamp(64px, 16vw, 104px); line-height: 1; font-variant-numeric: tabular-nums; color: var(--accent); }
.big small { font-size: .4em; color: var(--muted); font-weight: 500; }
.verdict { font-family: var(--display); font-style: italic; font-size: 22px; margin: 0; }
.review { display: grid; margin: 0; padding: 0; list-style: none; }
.review li { display: grid; grid-template-columns: 20px 1fr; gap: 10px; font-size: 14px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.review li:last-child { border-bottom: 0; }
.review .mark { font-family: "JetBrains Mono", ui-monospace, monospace; }
.review .mark.ok { color: var(--ok); }
.review .mark.no { color: var(--no); }
.review .ans { color: var(--muted); }
.foot { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; }
.foot a { color: var(--muted); }
.modes { display: grid; gap: 8px; margin-top: 8px; }
.mode {
  display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; text-align: left;
  border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 14px; background: var(--opt); color: var(--ink);
  transition: border-color .15s, transform .15s;
}
.mode:hover { border-color: var(--accent); transform: translateX(2px); }
.mode .mode-name { font-weight: 600; font-size: 15px; }
.mode .mode-meta { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px; color: var(--muted); }
.mode.facts { border-left: 4px solid var(--accent); }
.mode.emo { border-left: 4px solid var(--accent2); }
.mode.emo:hover { border-color: var(--accent2); }
.hero-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 6px; }
.tag { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px; letter-spacing: .04em; padding: 4px 12px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); }
.tag.emo { background: var(--accent2); color: #ffffff; }
.switch { background: none; border: 0; padding: 0; font-size: 14px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
.switch:hover { color: var(--accent); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body data-film="home">

<div class="wrap">
  <header class="mast">
    <span class="label">Thư viện câu đố phim</span>
    <h1>Đố Vui <em>Màn Ảnh</em></h1>
    <p>Chọn một bộ phim, trả lời từng câu và xem bạn nhớ phim đến đâu. Mỗi đáp án đều có giải thích kèm theo.</p>
  </header>

  <section id="library" aria-label="Chọn phim">
    <div class="shelf" id="shelf"></div>
  </section>

  <section id="game" class="game" hidden aria-live="polite"></section>

  <footer class="foot" id="foot"></footer>
</div>

<script>
const FILMS = [
  {
    id: "dau-xuan-tuoi-sang",
    motif: "早春晴朗",
    title: "Đầu Xuân Tươi Sáng",
    original: "早春晴朗 · The Early Spring · 2026",
    meta: "Trung Quốc · 24 tập · Tỉnh Bách Nhiên, Tôn Thiên",
    ordered: true,
    sources: [
      ["Youku (tên các tập)", "https://v.youku.com/v_show/id_XNjU1NDk1NzcwNA==.html"],
      ["TVmao (tóm tắt từng tập)", "https://www.tvmao.com/kanju/ZGFsIWFi"],
      ["HK01", "https://www.hk01.com/%E5%8D%B3%E6%99%82%E5%A8%9B%E6%A8%82/60382498/"],
      ["TV360", "https://tintuc.tv360.vn/blog/dau-xuan-tuoi-sang/"]
    ],
    emoSources: [
      ["EVA", "https://eva.vn/lang-sao/dau-xuan-tuoi-sang-vuot-200-trieu-luot-xem-chuyen-tinh-tong-tai-doc-mieng-nu-than-chan-dai-xem-vua-buc-vua-cuon-c20a682374.html"],
      ["Tuổi Trẻ", "https://tuoitre.vn/dan-quang-cao-khoc-rong-khi-xem-dau-xuan-tuoi-sang-10026090515281193.htm"],
      ["VnExpress", "https://vnexpress.net/ket-phim-dau-xuan-tuoi-sang-gay-tranh-luan-5118683.html"],
      ["Saostar", "https://www.saostar.vn/dien-anh/dau-xuan-tuoi-sang-cang-hot-cang-vuong-tranh-cai-202609111725230583.html"],
      ["GamerSky (Douban)", "https://www.gamersky.com/news/202609/2208186.shtml"],
      ["Sina (tập 17, 18)", "https://k.sina.com.cn/article_7879922982_1d5ae15260680bbkf6.html?from=ent"]
    ],
    emotions: [
      { q: "Báo EVA tóm cảm giác của khán giả khi xem chuyện tình \"tổng tài độc miệng\" Loan Niệm bằng cụm từ nào?", a: "Vừa bực vừa cuốn", w: ["Vừa sợ vừa thương", "Nhẹ nhàng, chữa lành", "Buồn ngủ, nhạt nhẽo"], e: "Loan Niệm độc miệng khiến người xem bực, nhưng chuyện tình của hai người vẫn cuốn đến mức không dừng được." },
      { q: "Theo Tuổi Trẻ, người làm nghề nào \"khóc ròng\" khi xem phim vì thấy quá giống đời thật?", a: "Dân quảng cáo", w: ["Bác sĩ", "Giáo viên", "Luật sư"], e: "Phim lấy bối cảnh công ty quảng cáo, nên người trong nghề thấy lại áp lực, sếp khó tính và những đêm sửa phương án của chính mình." },
      { q: "Tập 17, khi Chi Đào đứng ra tố cáo Trần Đông và Loan Niệm bảo vệ cô, được khán giả Trung Quốc gọi là gì?", a: "\"Thần nhất tập\", tập phim thần thánh", w: ["\"Quỷ nhất tập\", tập ám ảnh", "Tập nhàm chán nhất", "Tập bị cắt nhiều nhất"], e: "Tập 17 vừa hả hê vì kẻ xấu bị trừng trị, vừa ngọt vì Loan Niệm đứng về phía cô, nên được khen là \"thần nhất tập\"." },
      { q: "Ngay sau đó, tập 18 với chuỗi hiểu lầm và cãi vã lại bị khán giả gọi là gì?", a: "\"Quỷ nhất tập\", tập ngược tâm", w: ["\"Thần nhất tập\"", "Tập hài hước nhất", "Tập ngọt nhất"], e: "Tập 18 gần như ngược từ đầu đến cuối, hiểu lầm nối tiếp hiểu lầm, khiến người xem đau lòng." },
      { q: "Phim mở điểm Douban 6,7. Đánh giá của khán giả được mô tả thế nào?", a: "Phân cực rõ rệt", w: ["Gần như tuyệt đối", "Ai cũng chê", "Không ai quan tâm"], e: "Khoảng 28,3% chấm 3 sao, còn 27,7% chấm từ 2 sao trở xuống. Thích thì rất thích, ghét thì rất ghét." },
      { q: "Nhóm khán giả nào chấm phim thấp hơn hẳn?", a: "Fan đọc nguyên tác", w: ["Khán giả xem phim lần đầu", "Fan của Tôn Thiên", "Khán giả quốc tế"], e: "Fan phim chấm khoảng 7,2, còn fan đọc truyện chỉ chấm khoảng 4,4." },
      { q: "Fan nguyên tác tiếc nhất điều gì khi phim thay đổi so với truyện?", a: "Mất đi cảm giác chua xót, ngược tâm của truyện", w: ["Phim có quá nhiều cảnh hành động", "Phim đổi kết thành bi kịch", "Phim bỏ nhân vật Thượng Chi Đào"], e: "Người đọc truyện thấy bản phim ngọt hơn, Loan Niệm bớt lạnh lùng, nên không còn cái day dứt nặng nề của nguyên tác." },
      { q: "Khán giả thích phim thường khen tình cảm của hai nhân vật chính như thế nào?", a: "Kìm nén, thăm dò, chân thực như tình yêu người trưởng thành", w: ["Ngọt như kẹo, không có trắc trở", "Hài hước như sitcom", "Bi thảm như phim cổ trang"], e: "Nhiều người khen cách hai người vừa giữ khoảng cách vừa không buông được nhau, \"không có đường hóa học công nghiệp\"." },

      { q: "Tập 1: Mảng giao dịch thật của Madoff phát triển thành mô hình gì, góp phần vào sự ra đời của Nasdaq?", a: "Nhà tạo lập thị trường (market maker)", w: ["Ngân hàng đầu tư", "Công ty bảo hiểm", "Quỹ hưu trí"], e: "Vai trò market maker và công nghệ giao dịch điện tử đưa Madoff lên hàng tên tuổi lớn của Phố Wall." },
      { q: "Tập 1: Công ty kế toán gắn với bố vợ Madoff, do hai người tiếp quản thập niên 1970, tên là gì?", a: "Avellino & Bienes", w: ["Fairfield Greenwich", "Friehling & Horowitz", "Bank Medici"], e: "Avellino & Bienes gom tiền khách hàng chuyển cho Madoff, trở thành một trong những kênh dẫn vốn sớm nhất." },
      { q: "Tập 2: Netflix mô tả \"bàn tay vàng\" của Madoff lan từ Phố Wall tới đâu?", a: "Palm Beach", w: ["Las Vegas", "Hollywood", "Hồng Kông"], e: "Madoff tiếp cận giới giàu có ở Palm Beach, Florida, trong đó có hội viên Palm Beach Country Club." },
      { q: "Tập 2: Ở giai đoạn này, công việc của Madoff mở rộng sang đâu và bắt đầu gặp chuyện gì?", a: "Sang giới quỹ phòng hộ, và bắt đầu bị soi xét", w: ["Sang bất động sản, và phá sản", "Sang chính trị, và trúng cử", "Sang ngân hàng, và bị đóng cửa"], e: "Tiền từ các quỹ phòng hộ đổ vào nhiều hơn, kéo theo những câu hỏi đầu tiên về con số của ông." },
      { q: "Tập 2: Chủ đề chính của tập \"Don't Ask, Don't Tell\" là ai?", a: "Những người có thể đã nghi ngờ nhưng im lặng vì đang kiếm được tiền", w: ["Các nhân viên FBI", "Các nhà báo điều tra", "Gia đình Madoff"], e: "Lợi nhuận đều đặn khiến nhiều người chọn không hỏi, còn Madoff thì không kể." },
      { q: "Tập 2: Ai đóng vai Madoff trong các cảnh tái hiện?", a: "Joseph Scotto", w: ["Robert De Niro", "Richard Dreyfuss", "Joe Berlinger"], e: "Robert De Niro và Richard Dreyfuss từng đóng Madoff ở các phim khác. Trong loạt phim tài liệu này, diễn viên là Joseph Scotto." },
      { q: "Tập 2: Nhà báo nào, tác giả cuốn The Wizard of Lies, xuất hiện để phân tích vụ việc?", a: "Diana Henriques", w: ["Jim Campbell", "Erin Arvedlund", "Bethany McLean"], e: "Diana Henriques của New York Times là người từng phỏng vấn Madoff trong tù." },
      { q: "Tập 3: Netflix tóm tắt tập \"See No Evil\": ai điều tra những con số bất khả thi của Madoff?", a: "Các đối thủ cạnh tranh trong ngành", w: ["FBI", "Gia đình Madoff", "Nhân viên tầng 17"], e: "Những người cùng ngành thử làm lại chiến lược của Madoff và không thể đạt kết quả như ông." },
      { q: "Tập 3: SEC phản ứng thế nào với các cảnh báo?", a: "Bỏ qua nhiều dấu hiệu bất thường", w: ["Bắt giữ Madoff ngay", "Đóng cửa công ty", "Trao giải cho người tố giác"], e: "Tên tập \"See No Evil\" (không thấy điều xấu) nói đúng cách cơ quan quản lý đã nhắm mắt làm ngơ." },
      { q: "Tập 3: Harry Markopolos kết luận gì sau khi tự tính toán?", a: "Các con số của Madoff là giả", w: ["Madoff là thiên tài thật", "Madoff đang thua lỗ nhẹ", "Madoff giao dịch nội gián"], e: "Ông cho rằng không chiến lược thật nào cho ra lợi nhuận như vậy, rồi kiên trì báo cho SEC suốt nhiều năm." },
      { q: "Tập 3: Theo báo cáo nội bộ của SEC, khoản Madoff thật sự nắm giữ tại DTC so với số khách hàng tưởng mình có như thế nào?", a: "Ít hơn cả số tiền mà một khách hàng duy nhất tưởng mình có", w: ["Nhiều gấp đôi tổng tiền khách", "Bằng đúng tổng tiền khách", "Nhiều hơn một chút"], e: "Chỉ cần đối chiếu một tài khoản là đã có thể lật tẩy vụ lừa đảo, nhưng SEC không làm." },
      { q: "Tập 4: Vụ lừa đảo bị lộ trong bối cảnh nào?", a: "Khủng hoảng tài chính 2008", w: ["Bong bóng dot-com 2000", "Sự kiện 11/9/2001", "Đại dịch năm 2020"], e: "Thị trường sụp đổ, nhà đầu tư đồng loạt rút tiền, và không còn tiền mới để trả." },
      { q: "Tập 4: Vì sao mô hình của Madoff không thể trụ được nữa?", a: "Không đáp ứng nổi các yêu cầu rút tiền", w: ["Bị hacker tấn công", "Bị đối thủ mua lại", "Madoff tự nguyện nghỉ hưu"], e: "Mô hình Ponzi chỉ sống được khi tiền vào nhiều hơn tiền ra. Năm 2008, điều đó đảo ngược." },
      { q: "Tập 4: Ai báo cho nhà chức trách sau khi Madoff thú nhận?", a: "Hai con trai Mark và Andrew", w: ["Vợ ông, Ruth", "Frank DiPascali", "Harry Markopolos"], e: "Các con trai báo cáo cha mình, và ngày hôm sau FBI đến bắt Madoff." },
      { q: "Tập 4: Tin gì về nhà quản lý quỹ người Pháp có 1,5 tỷ USD tiền khách đặt ở Madoff được nhắc tới?", a: "Ông được phát hiện tử vong trong văn phòng ở Manhattan", w: ["Ông bỏ trốn sang châu Âu", "Ông được bồi thường đầy đủ", "Ông làm chứng chống lại Madoff"], e: "Cái chết cho thấy hậu quả của vụ lừa đảo lan đến cả những người trung gian." },
      { q: "Tập 4: Tên tập \"The Price of Trust\" gắn với nội dung nào?", a: "Nạn nhân mất trắng và nhiều năm chật vật đòi lại tiền", w: ["Madoff được giảm án", "SEC được khen thưởng", "Các quỹ trung gian thắng kiện"], e: "Netflix tóm tắt: cuộc sống của nạn nhân bị đảo lộn, họ đối mặt với nhiều năm trở ngại để lấy lại tiền." },
      { q: "Tập 4: Bi kịch nào xảy ra với gia đình Madoff tròn hai năm sau vụ bắt giữ?", a: "Con trai Mark Madoff tự tử", w: ["Ruth Madoff bị bắt", "Andrew Madoff vào tù", "Madoff vượt ngục"], e: "Mark mất ngày 11/12/2010. Vụ lừa đảo không chỉ hủy hoại nạn nhân mà cả chính gia đình Madoff." },
      { q: "Xuyên suốt phim: Bộ phim nói gì về chuyện Madoff đăng ký mảng tư vấn đầu tư với SEC?", a: "Mãi đến năm 2006 ông mới đăng ký", w: ["Ông đăng ký từ năm 1960", "Ông chưa bao giờ phải đăng ký", "SEC từ chối hồ sơ của ông"], e: "Suốt hàng chục năm, mảng làm ăn lớn nhất của ông không chịu sự giám sát như luật yêu cầu." },
      { q: "Xuyên suốt phim: SEC lần đầu nhận khiếu nại liên quan đến quỹ trung gian Avellino & Bienes vào năm nào?", a: "1992", w: ["1972", "2000", "2008"], e: "SEC có cơ hội phát hiện Madoff từ năm 1992, nhưng vụ việc khép lại mà không ai đào sâu vào nguồn tiền." }

    terms: [
      { q: "\"Palm Beach Country Club\" trong phim là gì?", a: "CLB thượng lưu ở Palm Beach, Florida, phần lớn thành viên là người Do Thái", w: ["Sân golf riêng của Madoff", "Tên quỹ đầu tư của Madoff", "Nhà tù nơi Madoff thụ án"], e: "Madoff là thành viên CLB này và nhiều hội viên giao tiền cho ông. Nhiều người mất phần lớn tài sản." },
      { q: "Vì sao Palm Beach Country Club là \"mỏ vàng\" của Madoff?", a: "Hội viên giàu có và tin nhau, giới thiệu nhau đầu tư", w: ["CLB được miễn thuế", "Madoff là chủ sở hữu CLB", "CLB có ngân hàng riêng"], e: "Trong một cộng đồng khép kín, lời giới thiệu của bạn bè thay cho việc thẩm định. Được Madoff \"nhận tiền\" còn là một đặc quyền." },
      { q: "\"Ponzi scheme\" (mô hình Ponzi) nghĩa là gì?", a: "Lấy tiền người đến sau trả \"lãi\" cho người đến trước", w: ["Bán khống cổ phiếu", "Vay ngân hàng để mua cổ phiếu", "Đầu tư vào bất động sản"], e: "Không có lợi nhuận thật. Hệ thống sụp khi tiền mới không đủ trả cho người muốn rút." },
      { q: "Mô hình Ponzi được đặt theo tên ai?", a: "Charles Ponzi, kẻ lừa đảo những năm 1920", w: ["Một nhà toán học Ý", "Người sáng lập Phố Wall", "Một thẩm phán Mỹ"], e: "Charles Ponzi lừa nhà đầu tư ở Boston bằng lời hứa lãi lớn từ phiếu đổi tem thư quốc tế." },
      { q: "\"Affinity fraud\" (lừa đảo dựa trên mối quan hệ) là gì?", a: "Lừa người trong cùng cộng đồng bằng niềm tin chung", w: ["Lừa đảo qua mạng xã hội", "Lừa đảo bảo hiểm", "Làm giả chữ ký"], e: "Madoff nhắm vào cộng đồng Do Thái của chính mình, từ CLB, quỹ từ thiện đến bạn bè của bố vợ." },
      { q: "\"Feeder fund\" (quỹ trung gian) là gì?", a: "Quỹ gom tiền khách hàng rồi giao cho Madoff quản lý", w: ["Quỹ cứu trợ nạn nhân", "Quỹ hưu trí nhà nước", "Quỹ của SEC"], e: "Như Fairfield Greenwich, các quỹ này thu phí cao nhưng hầu như không kiểm tra Madoff làm gì với tiền." },
      { q: "\"Split-strike conversion\" thực chất đóng vai trò gì trong vụ lừa đảo?", a: "Lớp vỏ nghe chuyên môn để che việc không giao dịch thật", w: ["Bí quyết giúp Madoff thắng lớn", "Phương pháp kiểm toán", "Tên phần mềm giao dịch"], e: "Chiến lược có thật, nhưng quy mô Madoff tuyên bố lớn hơn cả lượng quyền chọn trên thị trường, một điểm Markopolos chỉ ra." },
      { q: "\"Clawback\" trong quá trình bồi thường nghĩa là gì?", a: "Đòi lại tiền từ người đã rút nhiều hơn số tiền góp", w: ["Phạt tiền SEC", "Tịch thu nhà Madoff", "Hoàn thuế cho nạn nhân"], e: "Picard kiện những người được lợi để lấy lại tiền \"lãi ảo\" chia cho người mất trắng." },
      { q: "\"Net winner\" (người thắng ròng) là ai?", a: "Nhà đầu tư rút ra nhiều hơn số tiền đã gửi vào", w: ["Người phát hiện vụ lừa đảo", "Nạn nhân mất nhiều nhất", "Nhân viên được thưởng"], e: "Họ vô tình nhận tiền của người khác, nên là đối tượng của các vụ kiện clawback." },
      { q: "\"SEC\" là cơ quan nào?", a: "Ủy ban Chứng khoán và Giao dịch Hoa Kỳ", w: ["Cục Điều tra Liên bang", "Ngân hàng Trung ương Mỹ", "Sở Giao dịch New York"], e: "SEC giám sát thị trường chứng khoán, và bị chỉ trích nặng vì nhiều lần bỏ qua cảnh báo về Madoff." },
      { q: "\"Whistleblower\" như Harry Markopolos là gì?", a: "Người tố giác sai phạm", w: ["Người môi giới", "Người kiểm toán", "Người bảo lãnh"], e: "Markopolos tự tính toán và kết luận lợi nhuận của Madoff là bất khả thi, rồi kiên trì báo cho SEC." },
      { q: "\"Due diligence\" mà các quỹ trung gian bỏ qua nghĩa là gì?", a: "Thẩm định kỹ trước khi đầu tư", w: ["Trả phí đúng hạn", "Ký hợp đồng bảo mật", "Rút tiền định kỳ"], e: "Nếu kiểm tra giao dịch và kiểm toán viên (một văn phòng nhỏ ba người), họ đã có thể phát hiện điều bất thường." },
      { q: "\"Tầng 17\" trong phim mang ý nghĩa gì?", a: "Trung tâm của lừa đảo, nơi làm sao kê giả", w: ["Phòng làm việc của gia đình Madoff", "Phòng giao dịch thật", "Văn phòng SEC"], e: "Tầng 17 bị tách khỏi các tầng giao dịch thật. Nhân viên ở đây dùng máy tính cũ để in giao dịch bịa ra." },
      { q: "Khi thú nhận, Madoff nói với các con: \"It's all just one big lie\". Câu này có nghĩa gì?", a: "Toàn bộ mảng quản lý đầu tư là giả, không có giao dịch thật", w: ["Ông chỉ khai gian thuế một lần", "Báo chí đang bịa chuyện về ông", "Ông nói dối về tuổi thật"], e: "\"Tất cả chỉ là một lời nói dối lớn.\" Ông thừa nhận thực chất đó là một mô hình Ponzi khổng lồ." },
      { q: "Trước tòa, Madoff nói \"I have left a legacy of shame\". Ý ông là gì?", a: "Ông để lại di sản ô nhục cho gia đình và con cháu", w: ["Ông để lại tài sản cho con", "Ông tự hào về sự nghiệp", "Ông đổ lỗi cho nạn nhân"], e: "\"Tôi đã để lại một di sản ô nhục\", như chính các nạn nhân đã nói, cho gia đình và các cháu ông." },
      { q: "Án 150 năm tù có ý nghĩa gì, dù Madoff đã ngoài 70 tuổi?", a: "Mang tính biểu tượng và răn đe, đảm bảo ông chết trong tù", w: ["Để ông có thể được ân xá sớm", "Do luật bắt buộc mỗi tội 10 năm", "Để bồi thường cho SEC"], e: "Thẩm phán Chin muốn thể hiện mức độ nghiêm trọng của tội ác và gửi thông điệp đến nạn nhân lẫn giới tài chính." },
      { q: "Tên tập 2 \"Don't Ask, Don't Tell\" ám chỉ điều gì?", a: "Nhà đầu tư không hỏi, Madoff không kể, cùng im lặng vì lợi nhuận", w: ["Chính sách quân đội Mỹ", "Quy định bảo mật của SEC", "Lời khuyên của luật sư Madoff"], e: "\"Đừng hỏi, đừng kể\": miễn tiền lãi đều, không ai muốn đặt câu hỏi khó." },
      { q: "Tên tập 3 \"See No Evil\" nói về ai?", a: "Cơ quan quản lý và ngân hàng làm ngơ trước dấu hiệu sai phạm", w: ["Madoff giả mù", "Nạn nhân không đọc sao kê", "Nhân chứng mất tích"], e: "\"Không thấy điều xấu\": SEC, ngân hàng và quỹ trung gian đều có dấu hiệu trước mắt nhưng không hành động." },
      { q: "Tên tập 4 \"The Price of Trust\" muốn nói gì?", a: "Cái giá nạn nhân phải trả vì đã đặt niềm tin", w: ["Phí quản lý quỹ của Madoff", "Giá cổ phiếu sau khủng hoảng", "Tiền bảo lãnh tại ngoại"], e: "\"Cái giá của niềm tin\": gia đình, quỹ từ thiện và người về hưu mất trắng vì tin một người." },
      { q: "Vì sao lợi nhuận \"đều đặn đến hoàn hảo\" lại là dấu hiệu đáng ngờ?", a: "Thị trường thật luôn biến động, không ai thắng đều mọi tháng", w: ["Vì lãi suất ngân hàng cao hơn", "Vì luật cấm lãi đều", "Vì Madoff đầu tư vào vàng"], e: "Markopolos chỉ ra đường lợi nhuận của Madoff đi lên gần như thẳng tắp, gần như không có tháng lỗ. Điều đó trái với toán học thống kê." },

    emotions: [
      { q: "Metacritic tóm tắt cảm nhận của giới phê bình thế nào?", a: "Cảnh tái hiện gây xao nhãng nhưng phim rất nhiều thông tin", w: ["Hoàn hảo, không có điểm trừ", "Nhàm chán và sai sự thật", "Chỉ hợp với chuyên gia tài chính"], e: "Phim giải thích rõ tâm lý Madoff và cách vụ lừa đảo vận hành, dù phần dựng lại bị chê." },
      { q: "Điều The Guardian khen nhất ở phim là gì?", a: "Cho nạn nhân được lên tiếng", w: ["Phỏng vấn Madoff trực tiếp", "Hiệu ứng hình ảnh", "Nhạc phim"], e: "Ở tội phạm cổ cồn trắng, câu chuyện của nạn nhân thường bị bỏ qua. Phim cho họ thời lượng xứng đáng." },
      { q: "Một bài review gọi Madoff bằng hình ảnh nào?", a: "Kẻ sát nhân hàng loạt về tài chính", w: ["Robin Hood của phố Wall", "Thiên tài bị hiểu lầm", "Nạn nhân của hệ thống"], e: "Cách gọi nhấn mạnh sự tàn phá rộng và có chủ đích lên rất nhiều người." },
      { q: "Common Sense Media mô tả không khí hình ảnh của phim thế nào?", a: "Bộ lọc tối và cảnh tái hiện quay chậm đầy kịch tính", w: ["Màu sắc tươi sáng như phim hài", "Toàn bộ là hoạt hình", "Quay bằng camera giám sát"], e: "Tông tối, quay chậm khiến phim giống một bộ phim giật gân hơn là phim tài liệu truyền thống." },
      { q: "Tờ The JC chê điều gì ở phim?", a: "Tên phim quá cường điệu", w: ["Phim quá ngắn", "Thiếu phỏng vấn", "Sai năm sự kiện"], e: "Tờ báo cho rằng \"quái vật\" là cách gọi phóng đại, và con quái vật thật sự là lòng tham." },
      { q: "Biết SEC được cảnh báo từ năm 2000 mà không hành động, một bài review gọi phim là chân dung của điều gì?", a: "Một thất bại ngoạn mục của cơ quan nhà nước", w: ["Một chiến thắng của công lý", "Một câu chuyện cổ tích tài chính", "Một vụ án bị dựng lên"], e: "Người xem phẫn nộ khi thấy dấu hiệu đã rõ từ sớm nhưng cơ quan quản lý vẫn bỏ qua suốt 8 năm." }
    ]
  }
];
const COMING = ["Bạn muốn phim nào tiếp theo?"];
const KEYS = ["A", "B", "C", "D"];
const MODES = {
  facts: { suffix: "", label: "Kiến thức phim", list: (f) => f.questions, src: (f) => f.sources },
  eps: { suffix: "--tung-tap", label: "Mổ xẻ từng tập", list: (f) => f.episodes || [], src: (f) => f.epSources || [] },
  terms: { suffix: "--y-nghia", label: "Ý nghĩa & thuật ngữ", list: (f) => f.terms || [], src: (f) => f.termSources || [] },
  emo: { suffix: "--cam-xuc", label: "Cảm xúc khán giả", list: (f) => f.emotions || [], src: (f) => f.emoSources || [] },
  all: {
    suffix: "--tong-hop", label: "Ôn tập tổng hợp",
    list: (f) => {
      const parts = ["facts", "eps", "terms", "emo"].filter((m) => MODES[m].list(f).length);
      return parts.length > 1 ? parts.flatMap((m) => MODES[m].list(f).map((q) => ({ ...q, cat: MODES[m].label }))) : [];
    },
    src: (f) => [...f.sources, ...(f.epSources || []), ...(f.termSources || []), ...(f.emoSources || [])].filter((s, i, a) => a.findIndex((x) => x[1] === s[1]) === i)
  }
};

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const best = {
  get(id) { try { return Number(localStorage.getItem("best:" + id)) || 0; } catch { return 0; } },
  set(id, v) { try { if (v > this.get(id)) localStorage.setItem("best:" + id, v); } catch {} }
};
const keyOf = (film, mode) => film.id + MODES[mode].suffix;
function parseKey(key) {
  for (const mode of ["all", "eps", "emo", "terms", "facts"]) {
    const sfx = MODES[mode].suffix;
    if (sfx && !key.endsWith(sfx)) continue;
    const film = FILMS.find((f) => f.id === key.slice(0, key.length - sfx.length));
    if (film && MODES[mode].list(film).length) return { film, mode };
  }
  return null;
}

let state = null;

function renderShelf() {
  const films = FILMS.map((f) => {
    const modes = Object.keys(MODES).filter((m) => MODES[m].list(f).length).map((m) => {
      const n = MODES[m].list(f).length, b = best.get(keyOf(f, m));
      return `<button class="mode ${m}" data-key="${keyOf(f, m)}">
        <span class="mode-name">${MODES[m].label}</span>
        <span class="mode-meta">${n} câu${b ? ` · kỷ lục ${b}/${n}` : ""}</span>
      </button>`;
    }).join("");
    return `<article class="film" data-film="${f.id}">
      <span class="poster" aria-hidden="true">${esc(f.motif)}</span>
      <span class="body">
        <span class="label">${esc(f.original)}</span>
        <h3>${esc(f.title)}</h3>
        <span class="meta">${esc(f.meta)}</span>
        <span class="modes">${modes}</span>
      </span>
    </article>`;
  }).join("");
  const soon = COMING.map((t) => `<div class="film soon" aria-disabled="true"><span class="poster" aria-hidden="true">+</span><span class="body"><span class="label">Sắp có</span><h3>${esc(t)}</h3><span class="meta">Câu đố mới sẽ được thêm vào thư viện.</span></span></div>`).join("");
  $("#shelf").innerHTML = films + soon;
  $("#shelf").querySelectorAll(".mode[data-key]").forEach((el) => el.addEventListener("click", () => { location.hash = el.dataset.key; }));
}

function start(key) {
  const p = parseKey(key);
  if (!p) return showLibrary();
  const { film, mode } = p;
  const list = MODES[mode].list(film);
  const qs = ((mode === "facts" && film.ordered) || mode === "eps" ? list : shuffle(list)).map((x) => ({ ...x, opts: shuffle([x.a, ...x.w]) }));
  state = { film, mode, key, qs, i: 0, picks: [] };
  document.body.dataset.film = film.id;
  $("#library").hidden = true;
  $("#game").hidden = false;
  renderFoot();
  renderQ();
  window.scrollTo(0, 0);
}

function showLibrary() {
  state = null;
  document.body.dataset.film = "home";
  $("#game").hidden = true;
  $("#library").hidden = false;
  renderShelf();
  renderFoot();
}

function track() {
  return `<div class="track" aria-hidden="true">${state.qs.map((q, k) => {
    const p = state.picks[k];
    const cls = p === undefined ? (k === state.i ? "now" : "") : (p === q.a ? "ok" : "no");
    return `<span class="${cls}"></span>`;
  }).join("")}</div>`;
}

function header() {
  const { film, mode } = state;
  const switcher = Object.keys(MODES).filter((m) => m !== mode && MODES[m].list(film).length)
    .map((m) => `<button class="switch" data-key="${keyOf(film, m)}">${MODES[m].label} →</button>`).join("");
  return `
    <div class="topbar">
      <button class="back" id="back">← Thư viện phim</button>
      <span class="label">${esc(film.original)}</span>
    </div>
    <div class="hero">
      <span class="motif" aria-hidden="true">${esc(film.motif)}</span>
      <h1>${esc(film.title)}</h1>
      <div class="hero-row"><span class="tag ${mode}">${MODES[mode].label}</span>${switcher}</div>
    </div>
    ${track()}`;
}

function bindHeader() {
  $("#back").addEventListener("click", () => { location.hash = ""; });
  $("#game").querySelectorAll(".switch").forEach((b) => b.addEventListener("click", () => { location.hash = b.dataset.key; }));
}

function correct() { return state.picks.filter((p, k) => p === state.qs[k].a).length; }

function renderQ() {
  const { qs, i } = state;
  const q = qs[i];
  const picked = state.picks[i];
  const done = picked !== undefined;
  const ok = picked === q.a;
  $("#game").innerHTML = `${header()}
    <article class="card">
      <div class="qhead"><span class="num">Câu ${String(i + 1).padStart(2, "0")} / ${qs.length}${q.cat ? ` · <span class="cat">${esc(q.cat)}</span>` : ""}</span><span class="score">Đúng ${correct()}</span></div>
      <h2 class="q">${esc(q.q)}</h2>
      <div class="opts">${q.opts.map((o, k) => {
        let cls = "";
        if (done && o === q.a) cls = "right";
        else if (done && o === picked) cls = "wrong";
        return `<button class="opt ${cls}" data-o="${esc(o)}" ${done ? "disabled" : ""}><span class="key">${KEYS[k]}</span><span>${esc(o)}</span></button>`;
      }).join("")}</div>
      ${done ? `<div class="explain ${ok ? "ok" : "no"}"><strong>${ok ? "Chính xác!" : "Chưa đúng. Đáp án: " + esc(q.a)}</strong><p>${esc(q.e)}</p></div>
      <div class="actions"><button class="btn" id="next">${i + 1 < qs.length ? "Câu tiếp theo →" : "Xem kết quả"}</button></div>` : ""}
    </article>`;
  bindHeader();
  $("#game").querySelectorAll(".opt:not(:disabled)").forEach((b) => b.addEventListener("click", () => pick(b.dataset.o)));
  const nx = $("#next");
  if (nx) { nx.addEventListener("click", next); nx.focus({ preventScroll: true }); }
}

function pick(o) {
  if (state.picks[state.i] !== undefined) return;
  state.picks[state.i] = o;
  renderQ();
}

function next() {
  if (state.i + 1 < state.qs.length) { state.i++; renderQ(); }
  else renderResult();
}

function verdict(r, mode) {
  if (mode === "all") {
    if (r === 1) return "Hoàn hảo. Bạn đã nắm trọn bộ phim từ mọi góc nhìn.";
    if (r >= .75) return "Rất vững. Chỉ còn vài chỗ cần ôn lại.";
    if (r >= .5) return "Nắm được phần chính. Xem lại các câu sai bên dưới để ôn.";
    return "Hãy làm lại từng bộ quiz nhỏ trước rồi quay lại ôn tổng hợp.";
  }
  if (mode === "terms") {
    if (r === 1) return "Bạn nắm vững từng thuật ngữ và ẩn ý của phim.";
    if (r >= .75) return "Bạn hiểu rất sâu những gì phim muốn nói.";
    if (r >= .5) return "Khá ổn. Xem lại phim với từ điển tài chính bên cạnh nhé.";
    return "Phim còn nhiều tầng nghĩa đang chờ bạn khám phá.";
  }
  if (mode === "emo") {
    if (r === 1) return "Bạn đồng cảm với khán giả đến từng nhịp tim.";
    if (r >= .75) return "Bạn rất hiểu cộng đồng người xem.";
    if (r >= .5) return "Khá hiểu ý khán giả, thử lướt thêm vài bài review.";
    return "Có vẻ bạn xem phim một mình, chưa đọc bình luận nào.";
  }
  if (r === 1) return "Fan cứng chính hiệu. Bạn nhớ phim từng chi tiết.";
  if (r >= .75) return "Rất ấn tượng. Bạn đã xem phim kỹ.";
  if (r >= .5) return "Khá ổn. Xem lại vài tập là thành fan cứng.";
  return "Có lẽ đến lúc cày lại phim rồi.";
}

function renderResult() {
  const { qs, key, mode } = state;
  const c = correct();
  best.set(key, c);
  $("#game").innerHTML = `${header()}
    <article class="card result">
      <span class="label">Kết quả · ${MODES[mode].label}</span>
      <div class="big">${c}<small> / ${qs.length}</small></div>
      <p class="verdict">${verdict(c / qs.length, mode)}</p>
      <ul class="review">${qs.map((q, k) => {
        const ok = state.picks[k] === q.a;
        return `<li><span class="mark ${ok ? "ok" : "no"}">${ok ? "✓" : "✗"}</span><span>${esc(q.q)}<br><span class="ans">${ok ? esc(q.a) : `Bạn chọn ${esc(state.picks[k])} · Đáp án ${esc(q.a)}`}</span></span></li>`;
      }).join("")}</ul>
      <div class="actions">
        <button class="btn ghost" id="lib">Chọn phim khác</button>
        <button class="btn" id="again">Chơi lại</button>
      </div>
    </article>`;
  bindHeader();
  $("#lib").addEventListener("click", () => { location.hash = ""; });
  $("#again").addEventListener("click", () => start(key));
  window.scrollTo(0, 0);
}

function renderFoot() {
  const src = state ? MODES[state.mode].src(state.film) : [];
  $("#foot").innerHTML = state
    ? `Nguồn dữ kiện: ${src.map(([n, u]) => `<a href="${u}" target="_blank" rel="noopener">${n}</a>`).join(", ")}.`
    : `Mỗi phim có các bộ câu hỏi riêng (kiến thức phim, cảm xúc khán giả, với một số phim có thêm ý nghĩa & thuật ngữ) và một mục ôn tập tổng hợp gộp tất cả. Kỷ lục chỉ lưu trên trình duyệt của bạn.`;
}

function route() {
  const key = location.hash.slice(1);
  if (key && parseKey(key)) { if (!state || state.key !== key) start(key); }
  else showLibrary();
}

document.addEventListener("keydown", (e) => {
  if (!state || $("#game").hidden) return;
  const k = KEYS.indexOf(e.key.toUpperCase());
  const btns = $("#game").querySelectorAll(".opt:not(:disabled)");
  if (k >= 0 && btns[k]) btns[k].click();
});
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
